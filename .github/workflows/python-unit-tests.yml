name: Python Unit Test Module

on:
  workflow_call:
    inputs:
      egress-policy:
        description: Harden runner policy (audit or block)
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: Allowed endpoints when policy is block
        required: false
        type: string
        default: >
          github.com:443
          api.github.com:443
          pypi.org:443
          files.pythonhosted.org:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          github-releases.githubusercontent.com:443
          raw.githubusercontent.com:443
      extra-allowed-endpoints:
        description: Extra endpoints appended to allowed-endpoints (base list stays intact)
        required: false
        type: string
        default: ""
      python-version:
        required: false
        type: string
        default: "3.14"
      cache-type:
        required: false
        type: string
        default: "pip"
      requirements:
        required: false
        type: string
        default: "requirements.txt"
      dev-requirements:
        required: false
        type: string
        default: "requirements-dev.txt"

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          disable-sudo: true
          allowed-endpoints: >
            ${{ inputs.allowed-endpoints }}
            ${{ inputs.extra-allowed-endpoints }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python Environment
        uses: Bigorno12/ci-cd-templates/.github/actions/python-setup@93d0be296117da871f06b61fbcb643c7fcb2d280
        with:
          python-version: ${{ inputs.python-version }}
          cache-type: ${{ inputs.cache-type }}
          requirements: ${{ inputs.requirements }}
          dev-requirements: ${{ inputs.dev-requirements }}

      - name: Run Unit Tests (pytest)
        run: pytest -m "not integration" --junitxml=reports/TEST-unit.xml

      - name: Publish Unit Tests Report (pytest)
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        if: always()
        continue-on-error: true
        with:
          name: Python Unit Tests
          path: "reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: 'false'
