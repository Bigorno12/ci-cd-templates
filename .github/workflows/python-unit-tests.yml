name: Python Unit Test Module

on:
  workflow_call:
    inputs:
      egress-policy:
        description: Harden runner policy (audit or block)
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: Allowed endpoints when policy is block
        required: false
        type: string
        default: >
          github.com:443
          api.github.com:443
          auth.docker.io:443
          index.docker.io:443
          registry-1.docker.io:443
          production.cloudfront.docker.com:443
          pypi.org:443
          files.pythonhosted.org:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          github-releases.githubusercontent.com:443
          raw.githubusercontent.com:443
      extra-allowed-endpoints:
        description: Extra endpoints appended to allowed-endpoints (base list stays intact)
        required: false
        type: string
        default: ""
      python-version:
        required: false
        type: string
        default: "3.14"
      cache-type:
        required: false
        type: string
        default: "pip"
      requirements:
        required: false
        type: string
        default: "requirements.txt"
      dev-requirements:
        required: false
        type: string
        default: "requirements-dev.txt"
      postgres-image:
        description: >
          Postgres service container for the test run, e.g. "postgres:17-alpine".
          Empty (the default) starts no database and costs nothing. When set, the
          container is bound to 127.0.0.1:5432 with a per-run generated password, and
          DATABASE_URL / POSTGRES_* are exported to the test steps. Nothing is exported
          when it is empty, so your own fallback config is left alone.
        required: false
        type: string
        default: ""
      redis-image:
        description: >
          Redis service container for the test run, e.g. "redis:7-alpine". Empty starts
          no cache. When set, bound to 127.0.0.1:6379 behind a per-run generated
          requirepass, and exported as REDIS_URL / REDIS_*.
        required: false
        type: string
        default: ""

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: ${{ inputs.egress-policy }}
          disable-sudo: true
          allowed-endpoints: >
            ${{ inputs.allowed-endpoints }}
            ${{ inputs.extra-allowed-endpoints }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Start test services
        if: inputs.postgres-image != '' || inputs.redis-image != ''
        uses: Bigorno12/ci-cd-templates/.github/actions/test-services@869e85bd1d671532cd37c469fc14b39e9ba7fde7
        with:
          postgres-image: ${{ inputs.postgres-image }}
          redis-image: ${{ inputs.redis-image }}

      - name: Setup Python Environment
        uses: Bigorno12/ci-cd-templates/.github/actions/python-setup@869e85bd1d671532cd37c469fc14b39e9ba7fde7
        with:
          python-version: ${{ inputs.python-version }}
          cache-type: ${{ inputs.cache-type }}
          requirements: ${{ inputs.requirements }}
          dev-requirements: ${{ inputs.dev-requirements }}

      - name: Run Unit Tests (pytest)
        run: pytest -m "not integration" --junitxml=reports/TEST-unit.xml

      - name: Publish Unit Tests Report (pytest)
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        if: always()
        continue-on-error: true
        with:
          name: Python Unit Tests
          path: "reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: 'false'
