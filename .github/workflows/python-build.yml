name: Python Build Module

on:
  workflow_call:
    inputs:
      egress-policy:
        description: Harden runner policy (audit or block)
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: Allowed endpoints when policy is block
        required: false
        type: string
        default: >
          github.com:443
          api.github.com:443
          pypi.org:443
          files.pythonhosted.org:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          github-releases.githubusercontent.com:443
          raw.githubusercontent.com:443
      extra-allowed-endpoints:
        description: Extra endpoints appended to allowed-endpoints (base list stays intact)
        required: false
        type: string
        default: ""
      python-version:
        required: false
        type: string
        default: "3.14"
      cache-type:
        required: false
        type: string
        default: "pip"
      requirements:
        required: false
        type: string
        default: "requirements.txt"
      dev-requirements:
        required: false
        type: string
        default: "requirements-dev.txt"

jobs:
  build:
    name: Build & Compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: ${{ inputs.egress-policy }}
          disable-sudo: true
          allowed-endpoints: >
            ${{ inputs.allowed-endpoints }}
            ${{ inputs.extra-allowed-endpoints }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reject .env file
        run: |
          ENV_FILES=$(git ls-files --cached -- '*.env*' ':!:.env.example' || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::Tracked .env files detected – remove them before merging:"
            echo "$ENV_FILES"
            exit 1
          fi

      - name: Setup Python Environment
        uses: Bigorno12/ci-cd-templates/.github/actions/python-setup@869e85bd1d671532cd37c469fc14b39e9ba7fde7
        with:
          python-version: ${{ inputs.python-version }}
          cache-type: ${{ inputs.cache-type }}
          requirements: ${{ inputs.requirements }}
          dev-requirements: ${{ inputs.dev-requirements }}

      - name: Byte-compile sources
        run: |
          set -euo pipefail
          # The Python analogue of Maven's test-compile: the output is discarded,
          # it exists to fail fast on a syntax error before the serial verify phase.
          python -m compileall -q -f \
            -x '(^|/)(\.git|\.venv|venv|\.tox|node_modules|build|dist)(/|$)' .
