name: Python Verify

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.14"
      cache-type:
        required: false
        type: string
        default: "pip"
      requirements:
        required: false
        type: string
        default: "requirements.txt"
      dev-requirements:
        required: false
        type: string
        default: "requirements-dev.txt"
      postgres-image:
        description: Postgres service container for the test jobs (empty starts none)
        required: false
        type: string
        default: ""
      redis-image:
        description: Redis service container for the test jobs (empty starts none)
        required: false
        type: string
        default: ""
      egress-policy:
        required: false
        type: string
        default: "block"
      extra-test-endpoints:
        description: Extra endpoints appended to the lint/unit/integration base allowlists
        required: false
        type: string
        default: ""
      extra-security-endpoints:
        description: Extra endpoints appended to the security-scan base allowlist
        required: false
        type: string
        default: ""
      test-args:
        required: false
        type: string
        default: ""
    secrets:
      extra-secrets:
        description: >
          Optional JSON object of secrets to expose to the integration tests
          (see python-integration-tests.yml). Curate it explicitly; do not pass
          the whole secret store.
        required: false

jobs:
  lint:
    uses: ./.github/workflows/python-lint.yml
    permissions:
      contents: read
    with:
      python-version: ${{ inputs.python-version }}
      cache-type: ${{ inputs.cache-type }}
      requirements: ${{ inputs.requirements }}
      dev-requirements: ${{ inputs.dev-requirements }}
      egress-policy: ${{ inputs.egress-policy }}
      extra-allowed-endpoints: ${{ inputs.extra-test-endpoints }}

  unit-tests:
    uses: ./.github/workflows/python-unit-tests.yml
    permissions:
      checks: write
      contents: read
    with:
      python-version: ${{ inputs.python-version }}
      cache-type: ${{ inputs.cache-type }}
      requirements: ${{ inputs.requirements }}
      dev-requirements: ${{ inputs.dev-requirements }}
      postgres-image: ${{ inputs.postgres-image }}
      redis-image: ${{ inputs.redis-image }}
      egress-policy: ${{ inputs.egress-policy }}
      extra-allowed-endpoints: ${{ inputs.extra-test-endpoints }}

  integration-tests:
    uses: ./.github/workflows/python-integration-tests.yml
    permissions:
      checks: write
      contents: read
    with:
      python-version: ${{ inputs.python-version }}
      cache-type: ${{ inputs.cache-type }}
      requirements: ${{ inputs.requirements }}
      dev-requirements: ${{ inputs.dev-requirements }}
      postgres-image: ${{ inputs.postgres-image }}
      redis-image: ${{ inputs.redis-image }}
      egress-policy: ${{ inputs.egress-policy }}
      extra-allowed-endpoints: ${{ inputs.extra-test-endpoints }}
      test-args: ${{ inputs.test-args }}
    secrets:
      extra-secrets: ${{ secrets.extra-secrets }}

  security:
    uses: ./.github/workflows/python-security.yml
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      egress-policy: ${{ inputs.egress-policy }}
      extra-allowed-endpoints: ${{ inputs.extra-security-endpoints }}
