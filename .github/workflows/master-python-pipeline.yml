name: Python Master Pipeline

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.14"
      cache-type:
        required: false
        type: string
        default: "pip"
      requirements:
        description: Runtime requirements file installed by every phase
        required: false
        type: string
        default: "requirements.txt"
      dev-requirements:
        description: >
          Test and lint requirements file. It must provide pytest and ruff —
          the verify phase runs them directly, the way java-lint.yml relies on the
          consumer's Spotless configuration.
        required: false
        type: string
        default: "requirements-dev.txt"
      postgres-image:
        description: >
          Postgres service container for the unit + integration test jobs, e.g.
          "postgres:17-alpine". Empty (the default) starts nothing — right for a SQLite
          or no-database suite, and nothing is exported into the test environment, so
          your own settings fallback is untouched. When set, the container is bound to
          127.0.0.1 with a password generated per run and masked in the logs, and the
          jobs get DATABASE_URL plus the individual POSTGRES_* variables. A Django suite
          configured against Postgres needs this for the unit job too — its test runner
          creates a database regardless of what the tests touch.
        required: false
        type: string
        default: ""
      redis-image:
        description: >
          Redis service container for the unit + integration test jobs, e.g.
          "redis:7-alpine". Empty starts no cache. Same shape as postgres-image:
          loopback-bound, per-run requirepass, exported as REDIS_URL / REDIS_*.
        required: false
        type: string
        default: ""
      build-egress-policy:
        description: >
          Harden-runner policy for the build + verify (test/security) phases.
          Defaults to "block"; the allowlists below must cover every host these
          phases reach. Watch the first run and add any denied host (visible in
          the harden-runner run summary) before relying on it.
        required: false
        type: string
        default: "block"
      release-egress-policy:
        description: >
          Harden-runner policy for the release phase (docker publish + image
          signature verification). Defaults to "block"; the docker allowlist
          below must cover every host these jobs reach. Buildpack image builds
          pull from a broad set of registries, so watch the first runs and
          extend extra-docker-endpoints with any denied host (visible in the
          harden-runner run summary) before relying on it.
        required: false
        type: string
        default: "block"
      extra-build-endpoints:
        description: Extra endpoints appended to the build phase base allowlist
        required: false
        type: string
        default: ""
      extra-test-endpoints:
        description: Extra endpoints appended to the lint/unit/integration base allowlists
        required: false
        type: string
        default: ""
      extra-security-endpoints:
        description: Extra endpoints appended to the security-scan base allowlist
        required: false
        type: string
        default: ""
      extra-docker-endpoints:
        description: Extra endpoints appended to the docker-publish allowlist
        required: false
        type: string
        default: ""
      test-args:
        required: false
        type: string
        default: ""
      builder-image:
        description: Cloud Native Buildpacks builder used by pack build
        required: false
        type: string
        default: "paketobuildpacks/builder-jammy-base"
      pack-args:
        required: false
        type: string
        default: ""
      gitops-manifest-path:
        required: false
        type: string
        default: "k8s/api.yaml"
      extra-gitops-endpoints:
        description: Extra endpoints appended to the deploy-gitops base allowlist
        required: false
        type: string
        default: ""
      signer-identity-regexp:
        description: >
          Regexp the release phase's deploy-gitops job requires the image's
          keyless Cosign signature to match (cosign --certificate-identity-regexp).
          Empty defaults to a workflow file under the current repository owner.
          Pin it to the exact signing-workflow path for a tighter trust boundary,
          or set it when the signing reusable workflow lives in a different org
          than the consuming repo.
        required: false
        type: string
        default: ""
    secrets:
      CR_PAT:
        description: >
          Optional PAT for pushing to and cleaning up GHCR. Falls back to the
          job's GITHUB_TOKEN when not provided.
        required: false
      extra-secrets:
        description: >
          Optional JSON object of secrets to expose to the integration tests
          (see python-integration-tests.yml). Curate it explicitly; do not pass
          the whole secret store.
        required: false
      GITOPS_PAT:
        description: >
          Optional PAT for pushing the updated manifest to the GitOps repo.
          Falls back to the job's GITHUB_TOKEN when not provided.
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    uses: ./.github/workflows/python-build.yml
    permissions:
      contents: read
    with:
      python-version: ${{ inputs.python-version }}
      cache-type: ${{ inputs.cache-type }}
      requirements: ${{ inputs.requirements }}
      dev-requirements: ${{ inputs.dev-requirements }}
      egress-policy: ${{ inputs.build-egress-policy }}
      extra-allowed-endpoints: ${{ inputs.extra-build-endpoints }}

  dependency-graph:
    needs: build
    if: github.event_name == 'push'
    uses: ./.github/workflows/python-dependency-graph.yml
    permissions:
      contents: write
    with:
      python-version: ${{ inputs.python-version }}
      cache-type: ${{ inputs.cache-type }}
      requirements: ${{ inputs.requirements }}
      egress-policy: ${{ inputs.build-egress-policy }}
      extra-allowed-endpoints: ${{ inputs.extra-build-endpoints }}

  verify:
    uses: ./.github/workflows/python-verify.yml
    permissions:
      checks: write
      security-events: write
      actions: read
      contents: read
    with:
      python-version: ${{ inputs.python-version }}
      cache-type: ${{ inputs.cache-type }}
      requirements: ${{ inputs.requirements }}
      dev-requirements: ${{ inputs.dev-requirements }}
      postgres-image: ${{ inputs.postgres-image }}
      redis-image: ${{ inputs.redis-image }}
      egress-policy: ${{ inputs.build-egress-policy }}
      extra-test-endpoints: ${{ inputs.extra-test-endpoints }}
      extra-security-endpoints: ${{ inputs.extra-security-endpoints }}
      test-args: ${{ inputs.test-args }}
    secrets:
      extra-secrets: ${{ secrets.extra-secrets }}

  release:
    needs:
      - build
      - verify
    uses: ./.github/workflows/python-release.yml
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets:
      CR_PAT: ${{ secrets.CR_PAT }}
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
    with:
      python-version: ${{ inputs.python-version }}
      egress-policy: ${{ inputs.release-egress-policy }}
      extra-docker-endpoints: ${{ inputs.extra-docker-endpoints }}
      builder-image: ${{ inputs.builder-image }}
      pack-args: ${{ inputs.pack-args }}
      gitops-manifest-path: ${{ inputs.gitops-manifest-path }}
      extra-gitops-endpoints: ${{ inputs.extra-gitops-endpoints }}
      signer-identity-regexp: ${{ inputs.signer-identity-regexp }}

  build-gate:
    needs:
      - build
      - dependency-graph
      - verify
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: block
          disable-sudo: true

      - name: Check pipeline result
        env:
          BUILD: ${{ needs.build.result }}
          DEPGRAPH: ${{ needs.dependency-graph.result }}
          VERIFY: ${{ needs.verify.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          RESULTS=("$BUILD" "$DEPGRAPH" "$VERIFY" "$RELEASE")

          for result in "${RESULTS[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "❌ Pipeline failed or was cancelled"
              exit 1
            fi
          done

          echo "✅ Pipeline passed successfully!"
