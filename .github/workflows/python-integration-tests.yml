name: Python Integration Tests Module

on:
  workflow_call:
    inputs:
      egress-policy:
        description: Harden runner policy (audit or block)
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: Allowed endpoints when policy is block
        required: false
        type: string
        default: >
          github.com:443
          api.github.com:443
          pypi.org:443
          files.pythonhosted.org:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          github-releases.githubusercontent.com:443
          raw.githubusercontent.com:443
      extra-allowed-endpoints:
        description: Extra endpoints appended to allowed-endpoints (base list stays intact)
        required: false
        type: string
        default: ""
      python-version:
        required: false
        type: string
        default: "3.14"
      cache-type:
        required: false
        type: string
        default: "pip"
      requirements:
        required: false
        type: string
        default: "requirements.txt"
      dev-requirements:
        required: false
        type: string
        default: "requirements-dev.txt"
      test-args:
        description: Extra arguments to pass to pytest (e.g. -k or -o options)
        required: false
        type: string
        default: ""
    secrets:
      extra-secrets:
        description: >
          Optional JSON object ({"NAME":"value",...}) of secrets to expose as
          environment variables to the integration tests. Pass ONLY the secrets
          a test genuinely needs against a real external system. Prefer
          Testcontainers so tests are self-contained and need no secrets at all.
          Never pass toJSON(secrets) here — curate the object explicitly.
        required: false

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: ${{ inputs.egress-policy }}
          disable-sudo: true
          allowed-endpoints: >
            ${{ inputs.allowed-endpoints }}
            ${{ inputs.extra-allowed-endpoints }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python Environment
        uses: Bigorno12/ci-cd-templates/.github/actions/python-setup@93d0be296117da871f06b61fbcb643c7fcb2d280
        with:
          python-version: ${{ inputs.python-version }}
          cache-type: ${{ inputs.cache-type }}
          requirements: ${{ inputs.requirements }}
          dev-requirements: ${{ inputs.dev-requirements }}

      - name: Load Extra Secrets to Environment
        run: | # zizmor: ignore[github-env]
          if [ -z "$EXTRA_SECRETS" ]; then
            echo "No extra secrets provided — skipping."
            exit 0
          fi
          DELIM="EOF_$(openssl rand -hex 16)"
          echo "$EXTRA_SECRETS" \
            | jq -r --arg d "$DELIM" 'to_entries[] | select(.key | ascii_downcase != "github_token") | "\(.key)<<\($d)\n\(.value)\n\($d)"' \
            >> "$GITHUB_ENV"
        env:
          EXTRA_SECRETS: ${{ secrets.extra-secrets }}

      - name: Run Integration Tests (pytest)
        env:
          TEST_ARGS: ${{ inputs.test-args }}
        run: |
          set -euo pipefail
          STATUS=0
          # shellcheck disable=SC2086
          pytest -m integration --junitxml=reports/TEST-integration.xml $TEST_ARGS || STATUS=$?

          # 5 is pytest's "no tests collected". A repo with no integration-marked
          # tests is a valid state, unlike a genuine failure, so only 5 passes.
          if [ "$STATUS" -eq 5 ]; then
            echo "::warning::No tests matched the 'integration' marker — nothing to run."
            exit 0
          fi
          exit "$STATUS"

      - name: Publish Integration Tests Report (pytest)
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        if: always()
        continue-on-error: true
        with:
          name: Python Integration Tests
          path: "reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: 'false'
