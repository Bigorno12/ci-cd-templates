name: Unit Test Module

on:
  workflow_call:
    inputs:
      egress-policy:
        description: Harden runner policy (audit or block)
        required: false
        type: string
        default: "audit"
      allowed-endpoints:
        description: Allowed endpoints when policy is block
        required: false
        type: string
        default: ""
      java-version:
        required: false
        type: string
        default: "25"
      cache-type:
        required: false
        type: string
        default: "maven"

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.0
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}

      - uses: actions/checkout@v7.0.0

      - name: Setup Java Environment
        uses: Bigorno12/ci-cd-templates/.github/common@main
        with:
          java-version: ${{ inputs.java-version }}
          cache-type: ${{ inputs.cache-type }}

      - name: Run Unit Test (Maven)
        if: inputs.cache-type == 'maven'
        run: mvn -B test --file pom.xml

      - name: Publish Unit Tests Report (Maven)
        uses: dorny/test-reporter@v3
        if: always() && inputs.cache-type == 'maven'
        continue-on-error: true
        with:
          name: Maven Unit Tests
          path: "**/target/*-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: 'false'

      - name: Run Unit Test (Gradle)
        if: inputs.cache-type == 'gradle'
        run: ./gradlew test --no-daemon

      - name: Publish Unit Tests Report (Gradle)
        uses: dorny/test-reporter@v3
        if: always() && inputs.cache-type == 'gradle'
        continue-on-error: true
        with:
          name: Gradle Unit Tests
          path: "**/build/test-results/test/TEST-*.xml"
          reporter: java-junit
          fail-on-error: 'false'