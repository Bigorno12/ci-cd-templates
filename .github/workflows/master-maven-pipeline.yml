name: Maven Master Pipeline

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "25"
      cache-type:
        required: false
        type: string
        default: "maven"
      build-egress-policy:
        required: false
        type: string
        default: "audit"
      build-allowed-endpoints:
        required: false
        type: string
        default: >
          github.com:443
          repo.maven.apache.org:443
          api.github.com:443
          repo.spring.io:443
          repository.jboss.org:443
      extra-build-endpoints:
        required: false
        type: string
        default: ""
      test-allowed-endpoints:
        required: false
        type: string
        default: >
          github.com:443
          repo.maven.apache.org:443
          api.github.com:443
          repo.spring.io:443
          repository.jboss.org:443
      extra-test-endpoints:
        required: false
        type: string
        default: ""
      security-allowed-endpoints:
        required: false
        type: string
        default: >
          api.github.com:443
          github.com:443
          ghcr.io:443
          pkg-containers.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          repo.maven.apache.org:443
          repo.spring.io:443
          repository.jboss.org:443
          uploads.github.com:443
          objects.githubusercontent.com:443
      extra-security-endpoints:
        required: false
        type: string
        default: ""
      docker-allowed-endpoints:
        required: false
        type: string
        default: >
          auth.docker.io:443
          ghcr.io:443
          github.com:443
          production.cloudfront.docker.com:443
          registry-1.docker.io:443
          release-assets.githubusercontent.com:443
          repo1.maven.org:443
          api.github.com:443
          objects.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443
          fulcio.sigstore.dev:443
          rekor.sigstore.dev:443
          tuf-repo-cdn.sigstore.dev:443
      extra-docker-endpoints:
        required: false
        type: string
        default: ""
      test-args:
        required: false
        type: string
        default: ""
      spring-boot-args:
        required: false
        type: string
        default: ""
      gitops-manifest-path:
        required: false
        type: string
        default: "k8s/api.yaml"
      gitops-allowed-endpoints:
        required: false
        type: string
        default: >
          github.com:443
          api.github.com:443
      extra-gitops-endpoints:
        required: false
        type: string
        default: ""
    secrets:
      CR_PAT:
        description: >
          Optional PAT for pushing to and cleaning up GHCR. Falls back to the
          job's GITHUB_TOKEN when not provided.
        required: false
      extra-secrets:
        description: >
          Optional JSON object of secrets to expose to the integration tests
          (see integration-tests.yml). Curate it explicitly; do not pass the
          whole secret store.
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
      security-events: write
      checks: write
      pull-requests: write
    with:
      java-version: ${{ inputs.java-version }}
      cache-type: ${{ inputs.cache-type }}
      egress-policy: ${{ inputs.build-egress-policy }}
      allowed-endpoints: >
        ${{ inputs.build-allowed-endpoints }}
        ${{ inputs.extra-build-endpoints }}

  lint:
    needs: build
    uses: ./.github/workflows/lint.yml
    with:
      java-version: ${{ inputs.java-version }}
      cache-type: ${{ inputs.cache-type }}

  unit-tests:
    needs: build
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      checks: write
    with:
      java-version: ${{ inputs.java-version }}
      cache-type: ${{ inputs.cache-type }}
      egress-policy: ${{ inputs.build-egress-policy }}
      allowed-endpoints: >
        ${{ inputs.test-allowed-endpoints }}
        ${{ inputs.extra-test-endpoints }}

  integration-tests:
    needs: build
    uses: ./.github/workflows/integration-tests.yml
    permissions:
      checks: write
    with:
      java-version: ${{ inputs.java-version }}
      cache-type: ${{ inputs.cache-type }}
      egress-policy: ${{ inputs.build-egress-policy }}
      allowed-endpoints: >
        ${{ inputs.test-allowed-endpoints }}
        ${{ inputs.extra-test-endpoints }}
      test-args: ${{ inputs.test-args }}
    secrets:
      extra-secrets: ${{ secrets.extra-secrets }}

  security:
    needs: build
    uses: ./.github/workflows/security.yml
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      java-version: ${{ inputs.java-version }}
      cache-type: ${{ inputs.cache-type }}
      egress-policy: ${{ inputs.build-egress-policy }}
      allowed-endpoints: >
        ${{ inputs.security-allowed-endpoints }}
        ${{ inputs.extra-security-endpoints }}
  tag:
    needs: security
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    uses: ./.github/workflows/tag.yml
    permissions:
      contents: write

  docker-publish:
    needs: [unit-tests, integration-tests, security]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/docker.yml
    secrets:
      CR_PAT: ${{ secrets.CR_PAT }}
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      java-version: ${{ inputs.java-version }}
      cache-type: ${{ inputs.cache-type }}
      egress-policy: ${{ inputs.build-egress-policy }}
      allowed-endpoints: >
        ${{ inputs.docker-allowed-endpoints }}
        ${{ inputs.extra-docker-endpoints }}
      spring-boot-args: ${{ inputs.spring-boot-args }}

  deploy-gitops:
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-gitops.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      manifest-path: ${{ inputs.gitops-manifest-path }}
      allowed-endpoints: >
        ${{ inputs.gitops-allowed-endpoints }}
        ${{ inputs.extra-gitops-endpoints }}

  build-gate:
    needs:
      - build
      - lint
      - unit-tests
      - integration-tests
      - security
      - tag
      - docker-publish
      - deploy-gitops
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check pipeline result
        env:
          BUILD: ${{ needs.build.result }}
          LINT: ${{ needs.lint.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          INTEGRATION_TEST: ${{ needs.integration-tests.result }}
          SECURITY: ${{ needs.security.result}}
          TAG: ${{ needs.tag.result }}
          DOCKER_PUBLISH: ${{ needs.docker-publish.result }}
          GITOPS: ${{ needs.deploy-gitops.result }}
        run: |
          RESULTS=("$BUILD" "$LINT" "$UNIT_TESTS" "$INTEGRATION_TEST" "$SECURITY" "$TAG" "$DOCKER_PUBLISH" "$GITOPS")

          for result in "${RESULTS[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "❌ Pipeline failed or was cancelled"
              exit 1
            fi
          done

          echo "✅ Pipeline passed successfully!"
