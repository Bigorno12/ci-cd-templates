name: GitOps Manifest Module

on:
  workflow_call:
    inputs:
      manifest-path:
        description: Path to the kubernetes file to update
        required: false
        type: string
        default: "k8s/api.yaml"
      image-digest:
        description: >
          Full digest reference (name@sha256:...) of the image to verify before
          promoting. Required: an empty value fails the job closed rather than
          promoting an unverified artifact.
        required: true
        type: string
      signer-identity-regexp:
        description: >
          Regexp the image's keyless Cosign signature must match
          (cosign --certificate-identity-regexp). Empty defaults to any workflow
          file under the current repository owner. Pin it to the exact signing
          workflow for a tighter trust boundary, or set it when the signing
          reusable workflow lives in a different org than the consuming repo.
        required: false
        type: string
        default: ""
      egress-policy:
        description: Harden runner policy (audit or block)
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: Allowed endpoints when policy is block
        required: false
        type: string
        default: >
          github.com:443
          api.github.com:443
          ghcr.io:443
          pkg-containers.githubusercontent.com:443
          fulcio.sigstore.dev:443
          rekor.sigstore.dev:443
          tuf-repo-cdn.sigstore.dev:443
          timestamp.sigstore.dev:443
          release-assets.githubusercontent.com:443
          objects.githubusercontent.com:443
          github-releases.githubusercontent.com:443
      extra-allowed-endpoints:
        description: Extra endpoints appended to allowed-endpoints (base list stays intact)
        required: false
        type: string
        default: ""
    secrets:
      GITOPS_PAT:
        required: false
      CR_PAT:
        description: >
          Optional PAT for reading the signed image from GHCR. Falls back to the
          job's GITHUB_TOKEN when not provided.
        required: false

jobs:
  update-manifest:
    name: Verify Image & Update Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: ${{ inputs.egress-policy }}
          disable-sudo: true
          allowed-endpoints: >
            ${{ inputs.allowed-endpoints }}
            ${{ inputs.extra-allowed-endpoints }}

      # Everything below the verification gate mutates the repository, so the
      # gate runs first: no checkout, no commit, no push happens until cosign
      # has accepted the digest.
      - name: Login to Github Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT || github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Verify image signature (keyless)
        env:
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          OWNER: ${{ github.repository_owner }}
          IDENTITY_REGEXP: ${{ inputs.signer-identity-regexp }}
        run: |
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "::error::No image digest supplied to verify — refusing to promote."
            exit 1
          fi

          if [ -z "$IDENTITY_REGEXP" ]; then
            # Default: require a workflow file under the repo owner, not just any
            # identity. Set signer-identity-regexp to pin the exact signing workflow.
            IDENTITY_REGEXP="^https://github\.com/${OWNER}/[^/]+/\.github/workflows/"
          fi

          echo "Verifying signature for $IMAGE_DIGEST (identity ~ ${IDENTITY_REGEXP})"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_DIGEST"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          token: '${{ secrets.GITOPS_PAT || github.token }}'
          persist-credentials: true

      - name: Update Deployment Image Tag
        env:
          REPO_NAME: ${{ github.repository }}
          SHORT_SHA: ${{ github.sha }}
          MANIFEST_PATH: ${{ inputs.manifest-path }}
        run: |
          REPO_LC=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "$SHORT_SHA" | cut -c1-7)
          TAG="main-${SHORT_SHA}"
          IMAGE_NAME="ghcr.io/${REPO_LC}:${TAG}"

          echo "Updating Kubernetes deployment image to: ${IMAGE_NAME}"

          sed -i "s|image: ghcr.io/${REPO_LC}:.*|image: ${IMAGE_NAME}|g" "$MANIFEST_PATH"

      - name: Commit and Push Updated Manifests
        env:
          SHORT_SHA: ${{ github.sha }}
          MANIFEST_PATH: ${{ inputs.manifest-path }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST_PATH"

          if git diff --staged --quiet; then
            echo "No manifest changes detected."
          else
            SHORT_SHA=$(echo "$SHORT_SHA" | cut -c1-7)
            git commit -m "chore(gitops): update image tag to main-${SHORT_SHA} [skip ci]"
            git push
          fi
