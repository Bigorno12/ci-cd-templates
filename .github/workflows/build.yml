name: Build Module

on:
  workflow_call:
    inputs:
      egress-policy:
        description: Harden runner policy (audit or block)
        required: false
        type: string
        default: "block"
      extra-allowed-endpoints:
        description: >
          Extra endpoints appended to the shared Maven allowlist owned by
          .github/actions/harden (the base list stays intact).
        required: false
        type: string
        default: ""
      java-version:
        required: false
        type: string
        default: "25"
      cache-type:
        required: false
        type: string
        default: "maven"

jobs:
  build:
    name: Build & Compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: Bigorno12/ci-cd-templates/.github/actions/harden@378da88c539b1f8f1b0e3bdc4e1b52c5fa9854db
        with:
          egress-policy: ${{ inputs.egress-policy }}
          extra-endpoints: ${{ inputs.extra-allowed-endpoints }}

      - name: Prepare Java Workspace
        uses: Bigorno12/ci-cd-templates/.github/actions/java-workspace@378da88c539b1f8f1b0e3bdc4e1b52c5fa9854db
        with:
          java-version: ${{ inputs.java-version }}
          cache-type: ${{ inputs.cache-type }}

      - name: Reject .env file
        run: |
          ENV_FILES=$(git ls-files --cached -- '*.env' ':!:.env.example' | grep -v '\.env\.example$' || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::Tracked .env files detected – remove them before merging:"
            echo "$ENV_FILES"
            exit 1
          fi

      - name: Compile (Maven)
        run: ./mvnw -B -ntp -T 1C clean test-compile --file pom.xml

  dependency-graph:
    name: Submit Dependency Graph
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: ${{ inputs.egress-policy }}
          disable-sudo: true
          allowed-endpoints: >
            ${{ inputs.allowed-endpoints }}
            ${{ inputs.extra-allowed-endpoints }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java Environment
        uses: Bigorno12/ci-cd-templates/.github/actions/java-setup@378da88c539b1f8f1b0e3bdc4e1b52c5fa9854db
        with:
          java-version: ${{ inputs.java-version }}
          cache-type: ${{ inputs.cache-type }}

      - name: Make Maven wrappers executable
        run: chmod +x mvnw

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8
