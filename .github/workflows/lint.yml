name: Linting Module

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "25"
      cache-type:
        required: false
        type: string
        default: "maven"

jobs:
  spotless-check:
    name: Code Formatting (Spotless & Ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java Environment
        uses: ./.github/actions/java-setup@main
        with:
          java-version: ${{ inputs.java-version }}
          cache-type: ${{ inputs.cache-type }}

      - name: Make Maven wrappers executable
        if: inputs.cache-type == 'maven'
        run: chmod +x mvnw

      - name: Verify Code Formatting (Maven)
        if: inputs.cache-type == 'maven'
        run: ./mvnw -B -ntp spotless:check

      - name: Verify Code Formatting (Gradle)
        if: inputs.cache-type == 'gradle'
        run: ./gradlew spotlessCheck --no-daemon