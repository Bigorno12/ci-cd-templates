name: Python Dependency Graph Module

on:
  workflow_call:
    inputs:
      egress-policy:
        description: Harden runner policy (audit or block)
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: Allowed endpoints when policy is block
        required: false
        type: string
        default: >
          github.com:443
          api.github.com:443
          pypi.org:443
          files.pythonhosted.org:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          github-releases.githubusercontent.com:443
          raw.githubusercontent.com:443
      extra-allowed-endpoints:
        description: Extra endpoints appended to allowed-endpoints (base list stays intact)
        required: false
        type: string
        default: ""
      python-version:
        required: false
        type: string
        default: "3.14"
      cache-type:
        required: false
        type: string
        default: "pip"
      requirements:
        required: false
        type: string
        default: "requirements.txt"

jobs:
  dependency-graph:
    name: Submit Dependency Graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          disable-sudo: true
          allowed-endpoints: >
            ${{ inputs.allowed-endpoints }}
            ${{ inputs.extra-allowed-endpoints }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python Environment
        uses: Bigorno12/ci-cd-templates/.github/actions/python-setup@2b7a88a1373d871b00398939a8eb9b684420acb6
        with:
          python-version: ${{ inputs.python-version }}
          cache-type: ${{ inputs.cache-type }}
          requirements: ${{ inputs.requirements }}
          dev-requirements: ""

      - name: Update dependency graph
        uses: advanced-security/component-detection-dependency-submission-action@b282c67b1008fde9b60da4bdfcd8849613e293b2
        with:
          detectorsCategories: Pip
