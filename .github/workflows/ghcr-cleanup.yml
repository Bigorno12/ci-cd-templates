name: GHCR Cleanup Module

on:
  workflow_call:
    inputs:
      image-name:
        description: Name of the image to clean up
        required: true
        type: string
      pat-token:
        description: Personal Access Token for GHCR
        required: true
        type: string

jobs:
  cleanup:
    name: GHCR Cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - uses: actions/checkout@v7.0.0

      - name: Keep only the latest 3 images (Attempt 1)
        id: cleanup_1
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: snok/container-retention-policy@v3.1.0
        with:
          image-names: ${{ inputs.image-name }}
          cut-off: 0s
          timestamp-to-use: 'updated_at'
          keep-n-most-recent: '3'
          account: user
          token: ${{ inputs.pat-token }}

      - name: Wait 60s
        if: github.event_name != 'pull_request' && steps.cleanup_1.outcome == 'failure'
        run: sleep 60

      - name: Keep only the latest 3 images (Attempt 2)
        if: github.event_name != 'pull_request' && steps.cleanup_1.outcome == 'failure'
        continue-on-error: true
        uses: snok/container-retention-policy@v3.1.0
        with:
          image-names: ${{ inputs.image-name }}
          cut-off: 0s
          timestamp-to-use: 'updated_at'
          keep-n-most-recent: '3'
          account: user
          token: ${{ inputs.pat-token }}
