name: Integration Tests Module

on:
  workflow_call:
    inputs:
      egress-policy:
        description: Harden runner policy (audit or block)
        required: false
        type: string
        default: "audit"
      allowed-endpoints:
        description: Allowed endpoints when policy is block"
        required: false
        type: string
        default: ""
      java-version:
        required: false
        type: string
        default: "25"
      cache-type:
        required: false
        type: string
        default: "maven"
      test-args:
        description: Extra arguments to pass to the test runner (e.g. -D properties)
        required: false
        type: string
        default: ""

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java Environment
        uses: Bigorno12/ci-cd-templates/.github/actions/java-setup@main
        with:
          java-version: ${{ inputs.java-version }}
          cache-type: ${{ inputs.cache-type }}

      - name: Load Repository Secrets to Environment
        run: |
          echo "$SECRETS_JSON" | jq -r 'to_entries[] | "\(.key)<<EOF\n\(.value)\nEOF"' >> "$GITHUB_ENV"
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}

      - name: Make Maven wrappers executable
        if: inputs.cache-type == 'maven'
        run: chmod +x mvnw

      - name: Run Integration Tests (Maven)
        if: inputs.cache-type == 'maven'
        run: ./mvnw -B verify -Dsurefire.skip=true ${{ inputs.test-args }} --file pom.xml

      - name: Publish Integration Tests Report (Maven)
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        if: always() && inputs.cache-type == 'maven'
        continue-on-error: true
        with:
          name: Maven Integration Tests
          path: "**/target/*-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: 'false'

      - name: Make Gradle wrapper executable
        if: inputs.cache-type == 'gradle'
        run: chmod +x gradlew

      - name: Run Integration Tests (Gradle)
        if: inputs.cache-type == 'gradle'
        run: ./gradlew check -x test ${{ inputs.test-args }} --no-daemon

      - name: Publish Integration Tests Report (Gradle)
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        if: always() && inputs.cache-type == 'gradle'
        continue-on-error: true
        with:
          name: Gradle Integration Tests
          path: "**/build/test-results/integrationTest/TEST-*.xml"
          reporter: java-junit
          fail-on-error: 'false'