name: Buildpack Build and Push Module

on:
  workflow_call:
    inputs:
      egress-policy:
        description: Harden runner policy (audit or block)
        required: false
        type: string
        default: "audit"
      allowed-endpoints:
        description: Allowed endpoints when policy is block
        required: false
        type: string
        default: ""
      java-version:
        required: false
        type: string
        default: "25"
      cache-type:
        required: false
        type: string
        default: "maven"
      spring-boot-args:
        description: Extra arguments for the Spring Boot build command (e.g. profiles or modules)
        required: false
        type: string
        default: ""

jobs:
  build-and-push:
    name: Buildpack Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java Environment
        uses: Bigorno12/ci-cd-templates/.github/actions/java-setup@main
        with:
          java-version: ${{ inputs.java-version }}
          cache-type: ${{ inputs.cache-type }}

      - name: Login to Github Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || github.token }}

      - name: Make Maven wrappers executable
        if: inputs.cache-type == 'maven'
        run: chmod +x mvnw

      - name: Build and Push (Maven)
        if: inputs.cache-type == 'maven'
        env:
          REPO_NAME: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          REPO_LC=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "$SHORT_SHA" | cut -c1-7)
          
          if [ "$EVENT_NAME" == "pull_request" ]; then
            TAG="pr-${{ github.event.pull_request.number }}"
            PUBLISH=false
          else
            TAG="main-${SHORT_SHA}"
            PUBLISH="true"
          fi
          
          IMAGE_NAME="ghcr.io/$REPO_LC:$TAG"
          
          echo "Building image: $IMAGE_NAME"
          echo "Publishing to GHCR: $PUBLISH"

          ./mvnw clean package spring-boot:build-image ${{ inputs.spring-boot-args }} \
            -Dspring-boot.build-image.imageName=$IMAGE_NAME \
            -Dspring-boot.build-image.publish=$PUBLISH \
            -Dspring-boot.build-image.docker.publishRegistry.url=https://ghcr.io \
            -Dspring-boot.build-image.docker.publishRegistry.username=${{ github.actor }} \
            -Dspring-boot.build-image.docker.publishRegistry.password=${{ secrets.CR_PAT }}

      - name: Make Gradle wrapper executable
        if: inputs.cache-type == 'gradle'
        run: chmod +x gradlew

      - name: Build and Push (Gradle)
        if: inputs.cache-type == 'gradle'
        env:
          REPO_NAME: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          REPO_LC=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "$SHORT_SHA" | cut -c1-7)
          
          if [ "$EVENT_NAME" == "pull_request" ]; then
            TAG="pr-${{ github.event.pull_request.number }}"
            PUBLISH="false"
          else
            TAG="main-${SHORT_SHA}"
            PUBLISH="true"
          fi
          
          IMAGE_NAME="ghcr.io/$REPO_LC:$TAG"

          ./gradlew bootBuildImage ${{ inputs.spring-boot-args }} \
            --imageName=$IMAGE_NAME \
            --publishImage=$PUBLISH \
            -PpublishRegistryUsername=${{ github.actor }} \
            -PpublishRegistryPassword=${{ secrets.CR_PAT }} \
            --no-daemon

      - name: GHCR Cleanup (With Auto-retry)
        if: github.event_name != 'pull_request'
        uses: Bigorno12/ci-cd-templates/.github/actions/ghcr-cleanup@main
        with:
          image-name: ${{ github.event.repository.name }}
          pat-token: ${{ secrets.CR_PAT }}