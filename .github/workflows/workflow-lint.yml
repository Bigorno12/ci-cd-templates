name: Workflow Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github-releases.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 2 --retry-all-errors --retry-connrefused \
            --connect-timeout 10 --max-time 120 \
            -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          if ! echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -; then
            echo "::error::actionlint checksum mismatch - downloaded file is not the expected release asset"
            ls -l actionlint.tar.gz
            file actionlint.tar.gz
            head -c 512 actionlint.tar.gz | cat -v
            exit 1
          fi
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  allowlist-drift:
    name: allowlist-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github-releases.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Report partial toolchain allowlists
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import re

          GROUPS = {
              "maven": {
                  "repo.maven.apache.org:443",
                  "repo1.maven.org:443",
                  "repo.spring.io:443",
                  "repository.jboss.org:443",
              },
              "pypi": {
                  "pypi.org:443",
                  "files.pythonhosted.org:443",
              },
          }

          BLOCK = re.compile(
              r"^[ ]*allowed-endpoints:\n"
              r"(?:[ ]*(?:description|required|type):.*\n)*"
              r"[ ]*default:[ ]*>\n"
              r"((?:[ ]{10,}\S+\n)+)",
              re.M,
          )

          drift = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              with open(path) as fh:
                  match = BLOCK.search(fh.read())
              if not match:
                  continue
              hosts = set(match.group(1).split())
              for name, group in GROUPS.items():
                  present, missing = hosts & group, group - hosts
                  if present and missing:
                      drift += 1
                      print(
                          f"::warning file={path}::{name} allowlist is partial: "
                          f"declares {len(present)}/{len(group)} hosts, missing "
                          f"{' '.join(sorted(missing))}. Either add them, or record "
                          f"the omission as observed in workflow-rule.md."
                      )

          print(f"allowlist-drift: {drift} partial group(s) across the two trees.")
          PY

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github-releases.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054
        with:
          version: '1.16.3'
          persona: regular
          min-severity: medium
          advanced-security: false
          annotations: true
