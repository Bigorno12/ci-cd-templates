name: Harden Runner (Maven egress profile)
description: >
  step-security/harden-runner preloaded with the egress allowlist shared by the
  plain Java/Maven jobs: build, dependency-graph, lint, unit-tests and
  integration-tests. Jobs with a genuinely different network profile — security
  scanning, image publishing, GitOps — keep their own explicit allowlist rather
  than widening this one.

inputs:
  egress-policy:
    description: Harden runner policy (audit or block)
    required: false
    default: 'block'
  extra-endpoints:
    description: Extra endpoints appended to the base allowlist (base stays intact)
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
      with:
        egress-policy: ${{ inputs.egress-policy }}
        disable-sudo: true
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          github-releases.githubusercontent.com:443
          repo.maven.apache.org:443
          repo1.maven.org:443
          repo.spring.io:443
          repository.jboss.org:443
          ${{ inputs.extra-endpoints }}
