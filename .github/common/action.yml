name: Setup Java and Maven Environment
description: Installs latest LTS JDK version, configures Maven caching, and sets MAVEN_OPTS"

inputs:
  java-version:
    description: The JDK version to install
    required: false
    default: '25'
  cache-type:
    description: The dependency manager to cache (maven, gradle, etc)
    required: false
    default: 'maven'
  maven-opts:
    description: JVM options for Maven
    required: false
    default: "-Xms1g -Xmx1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XX:MaxMetaspaceSize=256m"
  gradle-opts:
    description: JVM options for Gradle
    required: false
    default: "-Xms1g -Xmx1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XX:MaxMetaspaceSize=256m"

runs:
  using: "composite"
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      id: setup-java
      uses: actions/setup-java@v5.5.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: 'temurin'
        cache: ${{ inputs.cache-type }}

    - name: Show cache status
      shell: bash
      run: |
        echo "Cache type: ${{ inputs.cache-type }}"
        echo "Cache hit: ${{ steps.setup-java.outputs.cache-hit}}"

    - name: Inject Global MAVEN_OPTS
      if: inputs.cache-type == 'maven'
      shell: bash
      run: |
        echo "MAVEN_OPTS=${{ inputs.maven-opts }}" >> $GITHUB_ENV

    - name: Inject Global GRADLE_OPTS
      if: inputs.gradle-ots == 'gradle'
      shell: bash
      run: |
        echo "GRADLE_OPTS=${{ inputs.gradle-opts }}" >> $GITHUB_ENV
        echo "GRADLE_USER_HOME=$GITHUB_WORKSPACE/.gradle" >> $GITHUB_ENV